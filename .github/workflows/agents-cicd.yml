# =============================================================================
# AIDataBoon Agents: CI/CD + Eval Gate
#
# Jobs:
#   lint-and-typecheck - ruff + mypy over agents
#   eval-gate          - 03_eval_harness.py against golden_qa.jsonl; fails
#                         the build if mean composite score < EVAL_MIN_SCORE
#                         (ADR-5). The RAG API runs inside the job on its
#                         synthetic knowledge base with LLM_PROVIDER=none, so
#                         the gate needs no external services and scores the
#                         same on every run.
#   build-agent-image  - builds Dockerfile.agents (main branch only)
#
# Deploys: the aidataboon-agents Render service auto-deploys "After CI
# checks pass", so Render only ships a commit once every job here succeeds.
#
# EVAL_MIN_SCORE is a regression baseline, set just below what the
# heuristic fallbacks score today (0.316). Raise it once an LLM and real
# embeddings are enabled.
# =============================================================================

name: AIDataBoon Agents CI/CD

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "data_platform/05_rag_service.py"
      - ".github/workflows/agents-cicd.yml"
  pull_request:
    paths:
      - "agents/**"
      - "data_platform/05_rag_service.py"
      - ".github/workflows/agents-cicd.yml"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Ruff
        run: uvx ruff check agents/

      - name: Mypy
        run: uv run --with mypy mypy agents/

  eval-gate:
    name: RAG Eval Gate
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      LLM_PROVIDER: none
      EVAL_MIN_SCORE: "0.30"
      RAG_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Start RAG API (synthetic knowledge base)
        env:
          EMBEDDINGS_ENABLED: "false"
          RERANKER_ENABLED: "false"
          # Unreachable on purpose: forces the in-memory store and the
          # built-in synthetic knowledge base.
          DATABASE_URL: postgresql://none@127.0.0.1:1/none
          LOCAL_GOLD_DIR: /nonexistent
          S3_ENDPOINT_URL: http://127.0.0.1:1
        run: |
          uv run --with fastapi --with "uvicorn[standard]" \
            uvicorn --app-dir data_platform 05_rag_service:app \
            --host 127.0.0.1 --port 8000 > rag_api.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "::error::RAG API did not start"
          cat rag_api.log
          exit 1

      - name: Run eval harness
        run: uv run python agents/03_eval_harness.py

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: |
            agents/eval_report.json
            rag_api.log

  build-agent-image:
    name: Build agent-api image
    runs-on: ubuntu-latest
    needs: eval-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build agent-api image
        uses: docker/build-push-action@v7
        with:
          context: agents
          file: agents/Dockerfile.agents
          push: false
          tags: aidataboon/agent-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
