# Generated by 07_observability.py — do not edit by hand.
groups:
- name: aidataboon_slos
  interval: 1m
  rules:
  - alert: AIDataBoonHnIngestionLagBreach
    expr: aidataboon_ingestion_lag_seconds{source="hackernews"} > 1800
    for: 10m
    labels:
      severity: warning
      slo: hn_ingestion_lag
    annotations:
      summary: Hacker News ingestion lag is breaching its SLO
      description: Hacker News ingestion lag = {{ $value }} seconds (target <= 300
        seconds, alert when > 1800 seconds)
  - alert: AIDataBoonArxivIngestionLagBreach
    expr: aidataboon_ingestion_lag_seconds{source="arxiv"} > 14400
    for: 10m
    labels:
      severity: warning
      slo: arxiv_ingestion_lag
    annotations:
      summary: arXiv ingestion lag is breaching its SLO
      description: arXiv ingestion lag = {{ $value }} seconds (target <= 3600 seconds,
        alert when > 14400 seconds)
  - alert: AIDataBoonBronzeToSilverDurationBreach
    expr: histogram_quantile(0.95, sum(rate(aidataboon_transform_duration_seconds_bucket{layer="silver"}[15m]))
      by (le)) > 600
    for: 10m
    labels:
      severity: warning
      slo: bronze_to_silver_duration
    annotations:
      summary: "Bronze\u2192Silver transform duration (p95) is breaching its SLO"
      description: "Bronze\u2192Silver transform duration (p95) = {{ $value }} seconds\
        \ (target <= 120 seconds, alert when > 600 seconds)"
  - alert: AIDataBoonSilverToGoldDurationBreach
    expr: histogram_quantile(0.95, sum(rate(aidataboon_transform_duration_seconds_bucket{layer="gold"}[15m]))
      by (le)) > 1200
    for: 10m
    labels:
      severity: warning
      slo: silver_to_gold_duration
    annotations:
      summary: "Silver\u2192Gold transform duration (p95) is breaching its SLO"
      description: "Silver\u2192Gold transform duration (p95) = {{ $value }} seconds\
        \ (target <= 300 seconds, alert when > 1200 seconds)"
  - alert: AIDataBoonEmbeddingThroughputBreach
    expr: aidataboon_embedding_throughput_docs_per_minute < 100
    for: 10m
    labels:
      severity: warning
      slo: embedding_throughput
    annotations:
      summary: Embedding batch throughput is breaching its SLO
      description: Embedding batch throughput = {{ $value }} docs/minute (target >=
        500 docs/minute, alert when < 100 docs/minute)
  - alert: AIDataBoonRagP50LatencyBreach
    expr: histogram_quantile(0.50, sum(rate(aidataboon_rag_request_duration_seconds_bucket{endpoint="/search"}[5m]))
      by (le)) > 0.5
    for: 10m
    labels:
      severity: warning
      slo: rag_p50_latency
    annotations:
      summary: RAG /search p50 latency is breaching its SLO
      description: RAG /search p50 latency = {{ $value }} seconds (target <= 0.2 seconds,
        alert when > 0.5 seconds)
  - alert: AIDataBoonRagP99LatencyBreach
    expr: histogram_quantile(0.99, sum(rate(aidataboon_rag_request_duration_seconds_bucket{endpoint="/search"}[5m]))
      by (le)) > 5.0
    for: 10m
    labels:
      severity: warning
      slo: rag_p99_latency
    annotations:
      summary: RAG /search p99 latency is breaching its SLO
      description: RAG /search p99 latency = {{ $value }} seconds (target <= 2.0 seconds,
        alert when > 5.0 seconds)
  - alert: AIDataBoonVectorIndexFreshnessBreach
    expr: aidataboon_vector_index_freshness_seconds > 7200
    for: 10m
    labels:
      severity: warning
      slo: vector_index_freshness
    annotations:
      summary: Vector index freshness vs. Gold is breaching its SLO
      description: Vector index freshness vs. Gold = {{ $value }} seconds (target
        <= 1800 seconds, alert when > 7200 seconds)
  - alert: AIDataBoonKafkaConsumerLagBreach
    expr: max(aidataboon_kafka_consumer_lag_messages) > 10000
    for: 10m
    labels:
      severity: warning
      slo: kafka_consumer_lag
    annotations:
      summary: Kafka consumer lag is breaching its SLO
      description: Kafka consumer lag = {{ $value }} messages (target <= 1000 messages,
        alert when > 10000 messages)
  - alert: AIDataBoonPipelineSuccessRateBreach
    expr: sum(rate(aidataboon_pipeline_runs_total{status="success"}[1h])) / sum(rate(aidataboon_pipeline_runs_total[1h]))
      < 0.95
    for: 10m
    labels:
      severity: warning
      slo: pipeline_success_rate
    annotations:
      summary: Pipeline success rate (1h) is breaching its SLO
      description: Pipeline success rate (1h) = {{ $value }} ratio (target >= 0.99
        ratio, alert when < 0.95 ratio)
