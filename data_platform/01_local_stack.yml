# =============================================================================
# AIDataBoon — Local Development Stack
# Docker Compose v2 — Production-quality local environment
# Domain: aidataboon.com
#
# Services (18 total):
#   Infrastructure:   postgres, minio, redis
#   Streaming:        zookeeper, kafka, schema-registry, kafka-connect
#   Orchestration:    airflow-init, airflow-webserver, airflow-scheduler, airflow-worker
#   ML Platform:      mlflow, feast-server
#   RAG API:          rag-api
#   Observability:    prometheus, grafana, otel-collector, jaeger
#
# Usage:
#   docker compose -f 01_local_stack.yml up -d
#   docker compose -f 01_local_stack.yml ps
#   docker compose -f 01_local_stack.yml down -v   # full reset
#
# Ports summary:
#   5432  PostgreSQL
#   6379  Redis
#   2181  Zookeeper
#   9000  MinIO API
#   9001  MinIO Console
#   9092  Kafka
#   8081  Schema Registry
#   8083  Kafka Connect (Debezium)
#   8080  Airflow Webserver
#   5000  MLflow
#   6566  Feast Feature Server
#   8000  RAG API (FastAPI)
#   9090  Prometheus
#   3000  Grafana
#   4317  OTel Collector (gRPC)
#   4318  OTel Collector (HTTP)
#   16686 Jaeger UI
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfdstI=}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://aidataboon:aidataboon_secret@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://aidataboon:aidataboon_secret@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-aidataboon_webserver_secret_change_in_prod}"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: otel-collector
    AIRFLOW__METRICS__STATSD_PORT: "8125"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    # S3 / MinIO for DAG logs and task artifacts
    AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://aidataboon-bronze/airflow-logs
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: minio_local
    # Connection configs injected as env vars (picked up by providers)
    AIRFLOW_CONN_MINIO_LOCAL: >-
      aws://minioadmin:minioadmin123@?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1
    AIRFLOW_CONN_POSTGRES_AIDATABOON: >-
      postgresql://aidataboon:aidataboon_secret@postgres:5432/aidataboon
    # Pass through optional tokens
    GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  volumes:
    - ./02_ingestion/dags:/opt/airflow/dags:ro
    - ./02_ingestion/operators:/opt/airflow/plugins/operators:ro
    - ./03_lakehouse/dags:/opt/airflow/dags/lakehouse:ro
    - ./03_lakehouse/transforms:/opt/airflow/transforms:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - aidataboon-net
  restart: unless-stopped

# =============================================================================
# SECTION 1: Core Infrastructure
# PostgreSQL (application DB + Airflow meta + MLflow backend + pgvector)
# MinIO (S3-compatible object storage — Bronze/Silver/Gold + MLflow artifacts)
# Redis (Celery broker for Airflow workers)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # Hosts: Airflow metadata, MLflow backend, application data, vector embeddings
  # pgvector extension enabled via init script
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aidataboon-postgres
    environment:
      POSTGRES_DB: aidataboon
      POSTGRES_USER: aidataboon
      POSTGRES_PASSWORD: aidataboon_secret
      POSTGRES_MULTIPLE_DATABASES: airflow,mlflow
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./07_observability/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidataboon -d aidataboon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - aidataboon-net
    restart: unless-stopped
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # Buckets (created by airflow-init or manual mc commands):
  #   aidataboon-bronze, aidataboon-silver, aidataboon-gold, mlflow-artifacts
  # Console: http://localhost:9001 (minioadmin / minioadmin123)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: aidataboon-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_UPDATE: "off"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - aidataboon-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO init — creates required buckets on first start
  # One-shot container (no restart)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-03-30T11-37-00Z
    container_name: aidataboon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/aidataboon-bronze &&
        mc mb --ignore-existing local/aidataboon-silver &&
        mc mb --ignore-existing local/aidataboon-gold &&
        mc mb --ignore-existing local/mlflow-artifacts &&
        mc mb --ignore-existing local/airflow-logs &&
        mc anonymous set download local/aidataboon-gold &&
        echo 'MinIO buckets initialized successfully'
      "
    networks:
      - aidataboon-net
    restart: "no"

  # ---------------------------------------------------------------------------
  # Redis 7 — Celery broker for Airflow CeleryExecutor
  # Also used as Feast online store for feature serving
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2.4-alpine
    container_name: aidataboon-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - aidataboon-net
    restart: unless-stopped

# =============================================================================
# SECTION 2: Streaming Layer
# Zookeeper → Kafka → Schema Registry → Kafka Connect (Debezium)
# Topics: raw.hn.stories, raw.arxiv.papers, raw.github.repos
# =============================================================================

  # ---------------------------------------------------------------------------
  # Zookeeper — Kafka coordination (required for Confluent 7.6)
  # Note: Kafka 3.x supports KRaft mode without Zookeeper, but Confluent
  #       7.6 connectors are more stable with Zookeeper in dev setups.
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: aidataboon-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,mntr"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - aidataboon-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Kafka (Confluent 7.6) — single broker dev setup
  # KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 required for single broker
  # Topics auto-created by producers; retention: 7 days / 1GB per topic
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: aidataboon-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners: internal (container-to-container) + external (host access)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single-broker settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_IN_SYNC_REPLICAS: 1
      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 days
      KAFKA_LOG_RETENTION_BYTES: 1073741824   # 1 GB per topic
      KAFKA_LOG_SEGMENT_BYTES: 104857600      # 100 MB segment size
      KAFKA_LOG_CLEANUP_POLICY: delete
      # Performance
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_COMPRESSION_TYPE: lz4
      # JVM heap
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      # Schema Registry integration
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"   # External access from host
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      - aidataboon-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Confluent Schema Registry — Avro/JSON Schema enforcement for Kafka topics
  # Producers register schemas; consumers validate on read
  # UI: http://localhost:8081
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: aidataboon-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_DEBUG: "false"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - aidataboon-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka Connect (Debezium 2.5) — CDC connectors
  # Used for: Postgres CDC → Kafka (change capture for Silver/Gold writes)
  # Connectors mounted from ./04_streaming/connectors/
  # REST API: http://localhost:8083
  # ---------------------------------------------------------------------------
  kafka-connect:
    image: debezium/connect:2.5.4.Final
    container_name: aidataboon-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: aidataboon-connect-cluster
      CONFIG_STORAGE_TOPIC: aidataboon_connect_configs
      OFFSET_STORAGE_TOPIC: aidataboon_connect_offsets
      STATUS_STORAGE_TOPIC: aidataboon_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Schema Registry integration
      KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Enable REST extensions for monitoring
      CONNECT_REST_EXTENSION_CLASSES: org.apache.kafka.connect.rest.basic.auth.extension.BasicAuthSecurityRestExtension
      CONNECT_PLUGIN_PATH: /kafka/connect,/debezium-connector-postgres
      CONNECT_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - ./04_streaming/connectors:/kafka/connect/aidataboon-connectors:ro
      - kafka-connect-data:/kafka/connect/offsets
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 256M
    networks:
      - aidataboon-net
    restart: unless-stopped

# =============================================================================
# SECTION 3: Airflow Orchestration
# CeleryExecutor with PostgreSQL backend and Redis broker
# airflow-init → webserver + scheduler + worker
# =============================================================================

  # ---------------------------------------------------------------------------
  # Airflow Init — one-time initialization container
  # Runs DB migrations (airflow db migrate) and creates admin user
  # Must complete successfully before other Airflow services start
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: aidataboon-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Wait for Postgres to accept connections
        until pg_isready -h postgres -U aidataboon -d airflow; do
          echo "Waiting for postgres..."; sleep 2;
        done

        # Create Airflow DB if it doesn't exist
        PGPASSWORD=aidataboon_secret psql -h postgres -U aidataboon -d aidataboon \
          -tc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1 || \
          PGPASSWORD=aidataboon_secret psql -h postgres -U aidataboon -d aidataboon \
          -c "CREATE DATABASE airflow;"

        # Run Airflow DB migrations
        airflow db migrate

        # Create admin user (idempotent)
        airflow users create \
          --role Admin \
          --username admin \
          --password admin \
          --firstname AIDataBoon \
          --lastname Admin \
          --email admin@aidataboon.com || true

        # Create Airflow connections for MinIO and PostgreSQL
        airflow connections add minio_local \
          --conn-type aws \
          --conn-host minio \
          --conn-port 9000 \
          --conn-login minioadmin \
          --conn-password minioadmin123 \
          --conn-extra '{"endpoint_url": "http://minio:9000", "region_name": "us-east-1"}' || true

        airflow connections add postgres_aidataboon \
          --conn-type postgres \
          --conn-host postgres \
          --conn-port 5432 \
          --conn-login aidataboon \
          --conn-password aidataboon_secret \
          --conn-schema aidataboon || true

        echo "Airflow initialization complete"
    environment:
      <<: *airflow-common-env
    restart: "no"

  # ---------------------------------------------------------------------------
  # Airflow Webserver — UI at http://localhost:8080
  # Default credentials: admin / admin
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: aidataboon-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Airflow Scheduler — DAG parsing and task scheduling
  # Heartbeat every 5 seconds; DAG scan every 30 seconds
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: aidataboon-airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Airflow Celery Worker — executes DAG tasks
  # Queue: default (expand to named queues for task routing in production)
  # Concurrency: 4 tasks simultaneously per worker
  # ---------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    container_name: aidataboon-airflow-worker
    command: celery worker
    environment:
      <<: *airflow-common-env
      AIRFLOW__CELERY__WORKER_CONCURRENCY: "4"
      DUMB_INIT_SETSID: "0"
      # Allow worker to access local models directory for embedding tasks
      SENTENCE_TRANSFORMERS_HOME: /opt/models
    volumes:
      - ./02_ingestion/dags:/opt/airflow/dags:ro
      - ./02_ingestion/operators:/opt/airflow/plugins/operators:ro
      - ./03_lakehouse/dags:/opt/airflow/dags/lakehouse:ro
      - ./03_lakehouse/transforms:/opt/airflow/transforms:ro
      - airflow-logs:/opt/airflow/logs
      - models-cache:/opt/models   # shared model weights volume
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - aidataboon-net
    restart: unless-stopped

# =============================================================================
# SECTION 4: ML Platform
# MLflow — experiment tracking + model registry + artifact store (MinIO)
# Feast — feature store server (offline: DuckDB, online: Redis)
# =============================================================================

  # ---------------------------------------------------------------------------
  # MLflow 2.x — ML experiment tracking and model registry
  # Backend: PostgreSQL (mlflow database)
  # Artifacts: MinIO at s3://mlflow-artifacts/
  # UI: http://localhost:5000
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: aidataboon-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # PostgreSQL backend store
      MLFLOW_BACKEND_STORE_URI: postgresql://aidataboon:aidataboon_secret@postgres:5432/mlflow
      # MinIO as S3-compatible artifact store
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_DEFAULT_REGION: us-east-1
      # Server config
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
      MLFLOW_WORKERS: "2"
      MLFLOW_GUNICORN_OPTS: "--timeout 120 --log-level warning"
    command: >
      mlflow server
        --backend-store-uri postgresql://aidataboon:aidataboon_secret@postgres:5432/mlflow
        --default-artifact-root s3://mlflow-artifacts/
        --host 0.0.0.0
        --port 5000
        --workers 2
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - aidataboon-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Feast Feature Server 0.36 — online feature serving
  # Offline store: DuckDB (reads Gold Delta tables from MinIO)
  # Online store: Redis (materialized features for low-latency serving)
  # Feature repo mounted from ./06_ml_platform/feast/
  # gRPC: 6566, HTTP: 6567
  # ---------------------------------------------------------------------------
  feast-server:
    image: feastdev/feature-server:0.40.0
    container_name: aidataboon-feast-server
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      FEAST_USAGE: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # MinIO access for offline store
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
    command: >
      feast -c /feast/feature_repo serve
        --host 0.0.0.0
        --port 6566
    volumes:
      - ./06_ml_platform/feast:/feast/feature_repo:ro
      - feast-data:/feast/.feast
    ports:
      - "6566:6566"   # gRPC + HTTP
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6566/get-online-features"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - aidataboon-net
    restart: unless-stopped

# =============================================================================
# SECTION 5: RAG API Service
# FastAPI application — the core product surface
# Handles: query embedding, ANN search, re-ranking, answer generation
# Dockerfile: ./Dockerfile.rag (built from 05_rag_service.py)
# =============================================================================

  # ---------------------------------------------------------------------------
  # RAG API — FastAPI application
  # Endpoints: POST /search, GET /trending, GET /topics, GET /health, GET /metrics
  # Embedding: sentence-transformers all-MiniLM-L6-v2 (bundled in image)
  # Vector DB: pgvector via psycopg2
  # Feature store: Feast gRPC client → feast-server:6566
  # Tracing: OpenTelemetry → otel-collector:4317
  # UI (Swagger): http://localhost:8000/docs
  # ---------------------------------------------------------------------------
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.rag
      args:
        PYTHON_VERSION: "3.11"
    image: aidataboon/rag-api:dev
    container_name: aidataboon-rag-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      feast-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      # Database
      DATABASE_URL: postgresql://aidataboon:aidataboon_secret@postgres:5432/aidataboon
      # Vector search
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: "5432"
      PGVECTOR_DB: aidataboon
      PGVECTOR_USER: aidataboon
      PGVECTOR_PASSWORD: aidataboon_secret
      # Feature store
      FEAST_SERVER_URL: feast-server:6566
      # Redis cache
      REDIS_URL: redis://redis:6379/1
      # MinIO / object storage
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_REGION: us-east-1
      S3_GOLD_BUCKET: aidataboon-gold
      # Embedding config
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_PROVIDER: local
      EMBEDDING_BATCH_SIZE: "64"
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      SENTENCE_TRANSFORMERS_HOME: /app/models
      # LLM for answer generation (local Ollama or OpenAI fallback)
      LLM_PROVIDER: "${LLM_PROVIDER:-none}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: aidataboon-rag-api
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # App settings
      LOG_LEVEL: info
      WORKERS: "2"
      PORT: "8000"
      CORS_ORIGINS: "http://localhost:3000,https://aidataboon.com,https://www.aidataboon.com"
      RAG_TOP_K_RETRIEVE: "20"
      RAG_TOP_K_RERANK: "5"
      RAG_CACHE_TTL_SECONDS: "300"
    volumes:
      - models-cache:/app/models   # shared sentence-transformers weights
      - rag-api-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s  # model loading takes ~30s on first start
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G    # sentence-transformers needs ~500MB RAM
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - aidataboon-net
    restart: unless-stopped

# =============================================================================
# SECTION 6: Observability Stack
# Prometheus (metrics) → Grafana (dashboards + alerts)
# OpenTelemetry Collector (traces + metrics ingestion)
# Jaeger (distributed trace UI)
# =============================================================================

  # ---------------------------------------------------------------------------
  # Prometheus 2.x — metrics collection and alerting
  # Scrapes: all services with /metrics endpoints
  # Config: ./07_observability/prometheus/prometheus.yml
  # UI: http://localhost:9090
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: aidataboon-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"          # Allow config reload via POST /-/reload
      - "--web.enable-admin-api"
    volumes:
      - ./07_observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./07_observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    networks:
      - aidataboon-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana 10 — dashboards and alerting
  # Auto-provisioned datasources: Prometheus, Jaeger (via datasources.yml)
  # GF_AUTH_ANONYMOUS_ENABLED=true for frictionless local development
  # Default admin: admin / admin
  # Dashboards: http://localhost:3000
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: aidataboon-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SERVER_DOMAIN: localhost
      # Auth — open for local dev, disable anonymous in production
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Datasources and dashboards provisioning via files
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Plugins to install on startup
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
      # Feature flags
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      # Log level
      GF_LOG_LEVEL: warn
    volumes:
      - ./07_observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./07_observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - aidataboon-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — central telemetry pipeline
  # Receives: OTLP gRPC (4317) + OTLP HTTP (4318) + StatsD (8125 UDP)
  # Exports: Prometheus (metrics), Jaeger (traces)
  # Config: ./07_observability/otel/otel-collector-config.yml
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: aidataboon-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./07_observability/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"    # OTLP gRPC — used by FastAPI + Airflow
      - "4318:4318"    # OTLP HTTP — used by browsers / scripts
      - "8889:8889"    # Prometheus metrics exporter (scraped by Prometheus)
      - "13133:13133"  # Health check extension
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - aidataboon-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Jaeger — distributed tracing UI
  # Receives spans from OTel Collector (via OTLP or Jaeger protocol)
  # UI: http://localhost:16686
  # Traces FastAPI request lifecycle: embed → search → rerank → respond
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: aidataboon-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory    # badger or elasticsearch for production
      QUERY_MAX_CLOCK_SKEW_ADJUSTMENT: 0
      LOG_LEVEL: warn
    ports:
      - "16686:16686"  # Jaeger UI
      - "6831:6831/udp"  # Jaeger UDP compact thrift (legacy agents)
      - "14250:14250"  # Jaeger gRPC model.proto
      - "14268:14268"  # Jaeger HTTP thrift (direct from apps)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - aidataboon-net
    restart: unless-stopped

# =============================================================================
# VOLUMES
# All named volumes — persisted across container restarts
# Use "docker compose down -v" to remove all volumes (full reset)
# =============================================================================

volumes:
  # Infrastructure
  postgres-data:
    driver: local
    name: aidataboon_postgres_data
  minio-data:
    driver: local
    name: aidataboon_minio_data
  redis-data:
    driver: local
    name: aidataboon_redis_data

  # Streaming
  zookeeper-data:
    driver: local
    name: aidataboon_zookeeper_data
  zookeeper-logs:
    driver: local
    name: aidataboon_zookeeper_logs
  kafka-data:
    driver: local
    name: aidataboon_kafka_data
  kafka-connect-data:
    driver: local
    name: aidataboon_kafka_connect_data

  # Orchestration
  airflow-logs:
    driver: local
    name: aidataboon_airflow_logs

  # ML Platform
  mlflow-data:
    driver: local
    name: aidataboon_mlflow_data
  feast-data:
    driver: local
    name: aidataboon_feast_data

  # RAG API
  rag-api-data:
    driver: local
    name: aidataboon_rag_api_data

  # Shared: ML model weights (sentence-transformers)
  # Shared between airflow-worker (embedding DAGs) and rag-api (query embedding)
  models-cache:
    driver: local
    name: aidataboon_models_cache

  # Observability
  prometheus-data:
    driver: local
    name: aidataboon_prometheus_data
  grafana-data:
    driver: local
    name: aidataboon_grafana_data

# =============================================================================
# NETWORKS
# Single bridge network — all containers communicate by service name
# External services (Neon, Upstash, Render) use host-level connectivity
# =============================================================================

networks:
  aidataboon-net:
    name: aidataboon_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
