<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Data Boon — Today's Hacker News, arXiv and GitHub, searchable</title>
  <meta name="description" content="Today's top Hacker News stories, new arXiv papers and trending GitHub repositories, with plain-English search over all of them." />
  <meta name="theme-color" content="#070a12" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aidataboon.com/" />
  <meta property="og:title" content="AI Data Boon" />
  <meta property="og:description" content="Today's top Hacker News stories, new arXiv papers and trending GitHub repositories, with plain-English search over all of them." />
  <!-- Dark is the default; light only when the visitor asked for it. Runs before paint so nothing flashes. -->
  <script>(function () { var t = "dark"; try { if (localStorage.getItem("adb_theme") === "light") t = "light"; } catch (e) {} document.documentElement.setAttribute("data-theme", t); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t === "light" ? "#eef1f6" : "#070a12"); })();</script>
  <!-- Corner brackets (cyan top left, magenta bottom right) around three source dots. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23070a12'/%3E%3Cpath d='M4 11V4h7' fill='none' stroke='%2322d3ee' stroke-width='3'/%3E%3Cpath d='M28 21v7h-7' fill='none' stroke='%23d946ef' stroke-width='3'/%3E%3Ccircle cx='10' cy='16' r='2.6' fill='%23fb923c'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23ff4d6d'/%3E%3Ccircle cx='22' cy='16' r='2.6' fill='%23a78bfa'/%3E%3C/svg%3E" />
  <style>
    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --radius: 3px;
      --pad-x: clamp(14px, 3vw, 40px);
    }
    :root[data-theme="light"] {
      --bg: #eef1f6;
      --surface: #ffffff;
      --surface-muted: #e4e8f0;
      --border: #cfd6e3;
      --text: #12151d;
      --text-muted: #545b6e;
      --text-faint: #6f788b;
      --accent: #0891b2;
      --accent-hover: #0e7490;
      --accent2: #a21caf;
      --accent-text: #ffffff;
      --accent-soft: rgba(8, 145, 178, 0.1);
      --accent-glow: rgba(8, 145, 178, 0.28);
      --bad: #dc2626;
      --hn: #c2410c;
      --arxiv: #be123c;
      --github: #6d28d9;
      color-scheme: light;
    }
    :root:not([data-theme="light"]) {
      --bg: #070a12;
      --surface: #0d1220;
      --surface-muted: #121a2c;
      --border: #202b45;
      --text: #e7ecf7;
      --text-muted: #8b95b3;
      --text-faint: #6b7694;
      --accent: #22d3ee;
      --accent-hover: #67e8f9;
      --accent2: #d946ef;
      --accent-text: #04141a;
      --accent-soft: rgba(34, 211, 238, 0.12);
      --accent-glow: rgba(34, 211, 238, 0.45);
      --bad: #ff4d6d;
      --hn: #fb923c;
      --arxiv: #ff6b88;
      --github: #a78bfa;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh; min-height: 100dvh;
      background:
        radial-gradient(ellipse 900px 460px at 50% -8%, var(--accent-soft), transparent 60%) no-repeat,
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    /* Small tracked caps: labels, counts, stats. */
    .label {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint);
    }

    /* ── App bar: wordmark | search | theme. Full width, sticky, gradient divider. ── */
    .appbar {
      position: sticky; top: 0; z-index: 40;
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .appbar::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; pointer-events: none;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 55%, transparent 92%); opacity: 0.55;
    }
    .appbar-in {
      display: flex; align-items: center; gap: clamp(10px, 2vw, 26px);
      min-height: 64px; padding: 10px var(--pad-x);
    }
    /* Wordmark between a cyan and a magenta corner bracket. */
    .brand {
      position: relative; flex: none; padding: 7px 14px;
      font-size: 1.05rem; font-weight: 800; letter-spacing: 0.01em; white-space: nowrap;
      color: var(--text); text-decoration: none;
    }
    .brand::before, .brand::after { content: ""; position: absolute; width: 10px; height: 10px; pointer-events: none; }
    .brand::before { top: 0; left: 0; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .brand::after { bottom: 0; right: 0; border-bottom: 2px solid var(--accent2); border-right: 2px solid var(--accent2); }
    .brand:hover { text-shadow: 0 0 12px var(--accent-glow); }

    .search { display: flex; align-items: flex-end; gap: 8px; flex: 1; min-width: 0; margin: 0; }
    .field { position: relative; flex: 1; min-width: 0; }
    /* A textarea so long questions wrap instead of scrolling out of view;
       it grows with its content (see autosize()). */
    #query {
      display: block; width: 100%; padding: 10px 14px; resize: none; overflow: hidden;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface-muted); color: var(--text);
      font: 500 0.98rem/1.35 var(--font-ui);
    }
    #query::placeholder { color: var(--text-faint); }
    #query:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 0 14px var(--accent-glow); }
    /* While searching, a lit segment sweeps along the bottom of the field. */
    .field::after {
      content: ""; position: absolute; left: 0; bottom: 0; width: 30%; height: 2px;
      background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); opacity: 0; pointer-events: none;
    }
    .busy .field::after { opacity: 1; animation: sweep 1.1s ease-in-out infinite alternate; }
    @keyframes sweep { from { left: 0; } to { left: 70%; } }

    button {
      padding: 10px 18px; border-radius: var(--radius); border: 1px solid transparent;
      background: var(--accent); color: var(--accent-text);
      font: 700 0.8rem/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: 0.06em;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }
    button:hover { background: var(--accent-hover); box-shadow: 0 0 16px var(--accent-glow); }
    button:disabled { opacity: 0.55; cursor: progress; }
    #submit-btn { padding: 11px 18px; }
    .icon-btn {
      display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 0; flex: none;
      background: transparent; border: 1px solid transparent; color: var(--text-muted);
      letter-spacing: 0;
    }
    .icon-btn:hover { background: var(--surface-muted); color: var(--text); border-color: var(--border); box-shadow: none; }
    .icon-btn svg { width: 18px; height: 18px; }
    .link-btn {
      padding: 0; border: 0; background: none; color: var(--accent);
      font: 600 0.72rem/1.4 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em;
    }
    .link-btn:hover { background: none; box-shadow: none; color: var(--accent-hover); text-shadow: 0 0 10px var(--accent-glow); }

    /* ── Page ── */
    main { flex: 1; width: 100%; padding: 20px var(--pad-x) 40px; }
    .page-head {
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px;
      margin: 0 0 16px;
    }
    .page-head h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.005em; }

    /* Cards carry the frame: corner brackets, cyan top left and magenta bottom right. */
    .card {
      position: relative; min-width: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px;
    }
    .card::before, .card::after { content: ""; position: absolute; width: 12px; height: 12px; pointer-events: none; opacity: 0.85; }
    .card::before { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .card::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent2); border-right: 2px solid var(--accent2); }

    .src-hackernews { --src: var(--hn); }
    .src-arxiv { --src: var(--arxiv); }
    .src-github { --src: var(--github); }
    /* A lit diamond in the source's colour marks each source. */
    .marker {
      display: inline-block; width: 7px; height: 7px; flex: none; transform: rotate(45deg);
      background: var(--src, var(--accent)); box-shadow: 0 0 6px 1px color-mix(in srgb, var(--src, var(--accent)) 55%, transparent);
    }

    /* ── Dashboard ── */
    .daily-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .col-head { display: flex; align-items: center; gap: 9px; margin: 0 0 2px; }
    .col-head h2 {
      margin: 0; flex: 1; color: var(--text);
      font: 700 0.78rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em;
    }
    .col-count { font: 600 0.74rem var(--font-mono); color: var(--src); font-variant-numeric: tabular-nums; }
    .col-sub { margin: 0 0 6px; }
    .daily-list { margin: 0; padding: 0; list-style: none; }
    .daily-item { padding: 10px 0 11px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
    .daily-item:last-child { border-bottom: 0; }
    .daily-item .t {
      display: block; font-weight: 650; font-size: 0.95rem; line-height: 1.32; text-decoration: none; color: var(--text);
    }
    .daily-item .t:hover { color: var(--accent); }
    .daily-item .d {
      margin: 3px 0 0; color: var(--text-muted); font-size: 0.84rem; line-height: 1.45;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .col-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 8px; }
    .col-foot:empty { display: none; }
    .col-status { margin: 10px 0 2px; color: var(--text-muted); font-size: 0.84rem; }
    .topics { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
    .topics .label { margin: 0 0 8px; }

    /* Stats and meta in mono with tabular figures. */
    .meta {
      display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 5px 0 0; padding: 0; list-style: none;
      font: 0.72rem var(--font-mono); color: var(--text-faint); font-variant-numeric: tabular-nums;
    }
    .meta a { color: var(--text-muted); text-underline-offset: 3px; }
    .meta a:hover { color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .chip {
      display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface-muted); color: var(--text-muted);
      font: 600 0.74rem/1.3 var(--font-ui); text-transform: none; letter-spacing: 0;
    }
    button.chip { cursor: pointer; }
    button.chip:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }

    /* Tabs (narrow screens): tracked caps with a lit underline. */
    .tabs { display: none; }

    /* ── Search view: results beside a sticky side card ── */
    .view-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); align-items: start; }
    .col-side { position: sticky; top: 84px; display: grid; gap: 14px; }
    .side-h { display: flex; align-items: center; gap: 9px; margin: 0 0 10px; }
    .side-h h2 { margin: 0; font: 700 0.78rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; }
    #status { color: var(--text-muted); font-size: 0.86rem; }
    #status.error { color: var(--bad); }
    .breakdown { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 10px 0 0; padding: 0; list-style: none; }
    .breakdown li { display: inline-flex; align-items: center; gap: 7px; font: 600 0.72rem var(--font-mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    #answer { margin: 12px 0 0; font-size: 1rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    /* Citations in the answer jump to the numbered result they cite. */
    #answer .cite {
      color: var(--accent); font: 700 0.72rem/1 var(--font-mono); text-decoration: none; vertical-align: 0.25em;
      text-shadow: 0 0 8px var(--accent-glow);
    }
    #answer .cite:hover { text-decoration: underline; }

    #sources { margin: 0; padding: 0; list-style: none; }
    #sources:empty { display: none; }
    .result { padding: 14px 0 15px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; scroll-margin-top: 84px; }
    .result:first-child { padding-top: 2px; }
    .result:last-child { border-bottom: 0; }
    .result:target { box-shadow: -18px 0 0 -16px var(--accent); }
    .result-source { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
    .result-num { font: 600 0.72rem var(--font-mono); color: var(--text-faint); }
    .result-src { font: 700 0.7rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--src); }
    .result h3 { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .result h3 a { text-decoration: none; }
    .result h3 a:hover { color: var(--accent); }
    .abstract {
      margin: 6px 0 0; color: var(--text-muted); font-size: 0.9rem; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .result .chips { margin-top: 8px; }
    .empty { margin: 0; padding: 4px 0; color: var(--text-muted); }
    .back { margin: 0 0 14px; }

    footer { padding: 0 var(--pad-x) 22px; color: var(--text-faint); font: 0.72rem var(--font-mono); letter-spacing: 0.04em; }

    /* Below 1020px: one column for search; the three sources become tabs. */
    @media (max-width: 1020px) {
      .view-grid { grid-template-columns: minmax(0, 1fr); }
      .col-side { position: static; order: -1; }
      .tabs { display: flex; gap: 22px; margin: 0 0 14px; border-bottom: 1px solid var(--border); overflow-x: auto; }
      .tab {
        display: flex; align-items: center; gap: 8px; padding: 11px 1px 12px; margin-bottom: -1px;
        background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
        color: var(--text-faint); font: 600 0.76rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em;
      }
      .tab:hover { background: none; box-shadow: none; color: var(--text-muted); }
      .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--src); box-shadow: 0 7px 10px -9px var(--src); }
      .tab .n { color: var(--src); font-variant-numeric: tabular-nums; }
      .tab:focus-visible { outline-offset: -2px; }
      .daily-grid { display: block; }
      .daily-grid > .card:not(.active) { display: none; }
      .col-head { display: none; }
    }
    @media (max-width: 640px) {
      .appbar-in { flex-wrap: wrap; row-gap: 10px; }
      .brand { order: 1; }
      .theme-btn { order: 2; margin-left: auto; }
      .search { order: 3; flex-basis: 100%; }
      .tabs { gap: 14px; }
      .tab { font-size: 0.7rem; letter-spacing: 0.04em; }
      .card { padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .busy .field::after { animation: none; left: 0; width: 100%; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-in">
      <a href="/" class="brand" id="home-link" aria-label="AI Data Boon, today's results">AI Data Boon</a>
      <form id="search-form" class="search" role="search">
        <div class="field">
          <label for="query" class="sr-only">Search Hacker News, arXiv and GitHub</label>
          <textarea id="query" rows="1" placeholder="Search Hacker News, arXiv and GitHub" autocomplete="off" enterkeyhint="search" maxlength="500" required></textarea>
        </div>
        <button type="submit" id="submit-btn">Search</button>
      </form>
      <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="Switch to light mode" title="Switch to light mode"></button>
    </div>
  </header>

  <main>
    <!-- Default view: the latest daily batch per source. -->
    <section id="dashboard" aria-labelledby="today-title">
      <div class="page-head">
        <h1 id="today-title">Today's results</h1>
        <p id="index-note" class="label"></p>
      </div>
      <div class="tabs" role="tablist" aria-label="Sources">
        <button type="button" role="tab" class="tab src-hackernews" data-src="hackernews" aria-selected="true" aria-controls="col-hackernews" id="tab-hackernews"><span class="marker"></span>Hacker News <span class="n"></span></button>
        <button type="button" role="tab" class="tab src-arxiv" data-src="arxiv" aria-selected="false" aria-controls="col-arxiv" id="tab-arxiv" tabindex="-1"><span class="marker"></span>arXiv <span class="n"></span></button>
        <button type="button" role="tab" class="tab src-github" data-src="github" aria-selected="false" aria-controls="col-github" id="tab-github" tabindex="-1"><span class="marker"></span>GitHub <span class="n"></span></button>
      </div>
      <div class="daily-grid">
        <section class="card src-hackernews active" id="col-hackernews" role="tabpanel" aria-labelledby="tab-hackernews">
          <div class="col-head"><span class="marker"></span><h2>Hacker News</h2><span class="col-count"></span></div>
          <p class="col-sub label"></p>
          <ul class="daily-list"></ul>
          <p class="col-status">Loading…</p>
          <div class="col-foot"></div>
        </section>
        <section class="card src-arxiv" id="col-arxiv" role="tabpanel" aria-labelledby="tab-arxiv">
          <div class="col-head"><span class="marker"></span><h2>New on arXiv</h2><span class="col-count"></span></div>
          <p class="col-sub label"></p>
          <ul class="daily-list"></ul>
          <p class="col-status">Loading…</p>
          <div class="col-foot"></div>
        </section>
        <section class="card src-github" id="col-github" role="tabpanel" aria-labelledby="tab-github">
          <div class="col-head"><span class="marker"></span><h2>Trending on GitHub</h2><span class="col-count"></span></div>
          <p class="col-sub label"></p>
          <ul class="daily-list"></ul>
          <p class="col-status">Loading…</p>
          <div class="col-foot"></div>
          <div class="topics" id="topics" hidden>
            <p class="label">Common topics</p>
            <ul class="chips"></ul>
          </div>
        </section>
      </div>
    </section>

    <!-- Search view -->
    <section id="search-view" hidden aria-label="Search results">
      <button type="button" class="link-btn back" id="back-btn">Back to today's results</button>
      <div class="view-grid">
        <div class="card">
          <ol id="sources"></ol>
          <p id="results-empty" class="empty" hidden></p>
        </div>
        <aside class="col-side">
          <div class="card">
            <div class="side-h"><span class="marker"></span><h2>Answer</h2></div>
            <div id="status" role="status" aria-live="polite"></div>
            <p id="answer" hidden></p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer>&copy; 2026 BoonCore</footer>

  <script>
    const API_BASE = "https://api.aidataboon.com/v1";
    const DAILY_LIMIT = 25; // fetched per source
    const DAILY_SHOWN = 8;  // shown before "Show more"

    const SOURCES = {
      hackernews: "Hacker News",
      arxiv: "arXiv",
      github: "GitHub",
    };

    const form = document.getElementById("search-form");
    const input = document.getElementById("query");
    const statusEl = document.getElementById("status");
    const answerEl = document.getElementById("answer");
    const sourcesEl = document.getElementById("sources");
    const resultsEmptyEl = document.getElementById("results-empty");
    const submitBtn = document.getElementById("submit-btn");
    const indexNoteEl = document.getElementById("index-note");
    const dashboardEl = document.getElementById("dashboard");
    const searchViewEl = document.getElementById("search-view");

    const numberFmt = new Intl.NumberFormat("en");
    const compactFmt = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
    const dateFmt = new Intl.DateTimeFormat("en", { year: "numeric", month: "short", day: "numeric" });
    const shortDateFmt = new Intl.DateTimeFormat("en", { month: "short", day: "numeric" });

    // ── Theme: dark by default, light on request, remembered per browser ──

    const ICONS = {
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    };
    const themeBtn = document.getElementById("theme-btn");
    function themeNow() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }
    function paintThemeButton() {
      const next = themeNow() === "light" ? "dark" : "light";
      const label = `Switch to ${next} mode`;
      themeBtn.innerHTML = next === "light" ? ICONS.sun : ICONS.moon;
      themeBtn.setAttribute("aria-label", label);
      themeBtn.title = label;
    }
    function setTheme(next) {
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("adb_theme", next); } catch (_) {}
      document.querySelector('meta[name="theme-color"]').setAttribute("content", next === "light" ? "#eef1f6" : "#070a12");
      paintThemeButton();
    }
    themeBtn.addEventListener("click", () => setTheme(themeNow() === "light" ? "dark" : "light"));
    paintThemeButton();

    // ── Small helpers ──────────────────────────────────────────────────────

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.assign(node, props);
      for (const child of [].concat(children)) {
        if (child) node.append(child);
      }
      return node;
    }

    function toInt(v) {
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? n : 0;
    }

    function plural(n, one, many) {
      return `${numberFmt.format(n)} ${n === 1 ? one : many}`;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "" : dateFmt.format(d);
    }

    function formatShortDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "" : shortDateFmt.format(d);
    }

    function formatRange(oldest, newest) {
      const a = formatShortDate(oldest);
      const b = formatShortDate(newest);
      return a && b && a !== b ? `${a} to ${b}` : b;
    }

    // Abstracts arrive HTML-escaped and, for HN, with inline markup.
    // DOMParser never runs scripts, so this only extracts the text.
    function plainText(html) {
      if (!html) return "";
      // Block-level tags become spaces so paragraphs don't run together.
      const spaced = String(html).replace(/<\/?(?:p|br|div|li|pre)\b[^>]*>/gi, " ");
      const doc = new DOMParser().parseFromString(spaced, "text/html");
      return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
    }

    // Tags come back as a list, or (from /search) as a Python list repr: "['a2a', 'agents']".
    function parseTags(raw) {
      if (Array.isArray(raw)) return raw;
      return [...String(raw || "").matchAll(/'([^']+)'/g)].map((m) => m[1]);
    }

    function formatAuthors(raw) {
      const names = String(raw || "").split(",").map((s) => s.trim()).filter(Boolean);
      if (names.length <= 3) return names.join(", ");
      return `${names.slice(0, 3).join(", ")} et al.`;
    }

    function hnDiscussionUrl(src) {
      const hnId = String(src.id || "").replace(/^hn_/, "");
      return hnId ? `https://news.ycombinator.com/item?id=${encodeURIComponent(hnId)}` : "";
    }

    // Retries Cloudflare's 524 (the API waking from scale-to-zero) before
    // giving up, so a cold start doesn't surface as a raw error.
    async function fetchWithWake(url, options, onWaiting) {
      const maxAttempts = 3;
      let res;
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        res = await fetch(url, options);
        if (res.status === 524 && attempt < maxAttempts) {
          if (onWaiting) onWaiting(5 * attempt);
          await new Promise((r) => setTimeout(r, 5000 * attempt));
          continue;
        }
        break;
      }
      if (!res.ok) throw new Error(`the API returned ${res.status}`);
      return res.json();
    }

    function describeError(err) {
      // fetch() rejects with a TypeError when the request never got a response.
      return err instanceof TypeError ? "couldn't reach the search service" : err.message;
    }

    // What matters differs per source: points and discussion for HN,
    // stars and forks for GitHub, authors and date for arXiv.
    function metaItems(src, { compact = false } = {}) {
      const items = [];
      const score = toInt(src.score);
      const comments = toInt(src.num_comments);
      if (src.source === "hackernews") {
        if (score) items.push(plural(score, "pt", "pts"));
        const url = hnDiscussionUrl(src);
        if (url) {
          items.push(el("a", { href: url, target: "_blank", rel: "noopener", textContent: plural(comments, "comment", "comments") }));
        }
        if (!compact && src.author) items.push(`by ${src.author}`);
        if (src.published_at) items.push(compact ? formatShortDate(src.published_at) : formatDate(src.published_at));
      } else if (src.source === "github") {
        if (score) items.push(`★ ${compact ? compactFmt.format(score) : numberFmt.format(score)}`);
        if (comments && !compact) items.push(plural(comments, "fork", "forks"));
        // A repo's date is its creation date.
        if (src.published_at && !compact) items.push(`created ${formatDate(src.published_at)}`);
      } else {
        if (src.author) items.push(formatAuthors(src.author));
        if (src.published_at && !compact) items.push(formatDate(src.published_at));
      }
      return items.filter(Boolean);
    }

    // ── Dashboard ──────────────────────────────────────────────────────────

    function dailyItem(src) {
      const li = el("li", { className: "daily-item" });
      li.append(el("a", { className: "t", href: src.url || "#", target: "_blank", rel: "noopener", textContent: src.title || "Untitled" }));
      // HN self-posts and arXiv abstracts are long; repo descriptions are the point.
      const desc = plainText(src.abstract);
      if (desc && desc !== src.title && src.source !== "hackernews") li.append(el("p", { className: "d", textContent: desc }));
      const meta = metaItems(src, { compact: true });
      if (meta.length) li.append(el("ul", { className: "meta" }, meta.map((m) => el("li", {}, m))));
      return li;
    }

    function colSubtitle(key, info) {
      const range = info.newest ? `, ${formatRange(info.oldest, info.newest)}` : "";
      if (key === "hackernews") return `By points${range}`;
      if (key === "arxiv") return `Newest first${range}`;
      return "By stars";
    }

    function renderColumn(key, info) {
      const col = document.getElementById(`col-${key}`);
      const list = col.querySelector(".daily-list");
      const status = col.querySelector(".col-status");
      const foot = col.querySelector(".col-foot");
      col.querySelector(".col-sub").textContent = colSubtitle(key, info);
      col.querySelector(".col-count").textContent = numberFmt.format(info.count);
      document.querySelector(`#tab-${key} .n`).textContent = numberFmt.format(info.count);
      list.replaceChildren(...info.items.map(dailyItem));
      foot.replaceChildren();
      if (!info.items.length) {
        status.textContent = "Nothing in today's batch.";
        return;
      }
      status.hidden = true;
      const hidden = [...list.children].slice(DAILY_SHOWN);
      if (hidden.length) {
        hidden.forEach((li) => (li.hidden = true));
        const more = el("button", { type: "button", className: "link-btn", textContent: `Show ${hidden.length} more` });
        more.addEventListener("click", () => {
          hidden.forEach((li) => (li.hidden = false));
          more.remove();
          if (info.count > info.items.length) {
            foot.append(el("span", { className: "label", textContent: `Top ${info.items.length} of ${numberFmt.format(info.count)}. Search to find the rest.` }));
          }
        });
        foot.append(more);
      }
    }

    function renderTopics(topics) {
      if (!topics || !topics.length) return;
      const box = document.getElementById("topics");
      box.querySelector(".chips").replaceChildren(...topics.map((t) => {
        const b = el("button", { type: "button", className: "chip", textContent: t.topic, title: `Search for ${t.topic}` });
        b.addEventListener("click", () => runSearch(`Trending repos about ${t.topic}`));
        return el("li", {}, b);
      }));
      box.hidden = false;
    }

    async function loadDaily() {
      try {
        const data = await fetchWithWake(`${API_BASE}/daily?limit=${DAILY_LIMIT}`, {}, (secs) => {
          for (const s of document.querySelectorAll(".col-status")) {
            s.textContent = `The service is starting up. Trying again in ${secs} seconds…`;
          }
        });
        if (data.data_as_of) indexNoteEl.textContent = `Refreshed daily. Newest ${formatDate(data.data_as_of)}`;
        for (const key of Object.keys(SOURCES)) {
          if (data.sources && data.sources[key]) renderColumn(key, data.sources[key]);
        }
        renderTopics(data.topics);
      } catch (err) {
        for (const s of document.querySelectorAll(".col-status")) {
          s.textContent = `Today's results didn't load: ${describeError(err)}. Reload the page to try again.`;
        }
      }
    }

    // Tabs (narrow screens): one source at a time, arrow keys move between them.
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    function selectTab(tab) {
      for (const t of tabs) {
        const on = t === tab;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute("aria-controls")).classList.toggle("active", on);
      }
    }
    for (const tab of tabs) {
      tab.addEventListener("click", () => selectTab(tab));
      tab.addEventListener("keydown", (e) => {
        const i = tabs.indexOf(tab);
        const next = e.key === "ArrowRight" ? tabs[(i + 1) % tabs.length] : e.key === "ArrowLeft" ? tabs[(i + tabs.length - 1) % tabs.length] : null;
        if (next) {
          e.preventDefault();
          selectTab(next);
          next.focus();
        }
      });
    }

    // ── Search ─────────────────────────────────────────────────────────────

    // Lets phrases like "top 3", "first 10", or "5 papers" control how
    // many results come back, instead of always requesting 5.
    function extractLimit(query) {
      const patterns = [
        /\btop\s+(\d+)\b/i,
        /\bfirst\s+(\d+)\b/i,
        /\b(\d+)\s+(?:results?|sources?|articles?|items?|papers?|repos?|repositories?|posts?)\b/i,
      ];
      for (const re of patterns) {
        const match = query.match(re);
        if (match) {
          const n = parseInt(match[1], 10);
          if (n >= 1 && n <= 20) return n;
        }
      }
      return 5;
    }

    // The API returns results newest first; this keeps that order if an
    // older API version answers. Undated results go last.
    function newestFirst(sources) {
      const time = (s) => {
        const t = new Date(s.published_at).getTime();
        return Number.isNaN(t) ? -Infinity : t;
      };
      return [...sources].sort((a, b) => time(b) - time(a));
    }

    // `n` is the result's citation number, as used in the answer's [n].
    function renderResult(src, n) {
      const key = SOURCES[src.source] ? src.source : "other";
      const li = el("li", { className: `result src-${key}`, id: `result-${n}` });

      li.append(el("p", { className: "result-source" }, [
        el("span", { className: "result-num", textContent: `[${n}]` }),
        el("span", { className: "marker" }),
        el("span", { className: "result-src", textContent: SOURCES[src.source] || src.source || "Source" }),
      ]));

      const title = el("a", { href: src.url || "#", target: "_blank", rel: "noopener", textContent: src.title || src.id || "Untitled" });
      li.append(el("h3", {}, title));

      const abstract = plainText(src.abstract || src.content);
      if (abstract && abstract !== src.title) {
        li.append(el("p", { className: "abstract", textContent: abstract }));
      }

      const meta = metaItems(src);
      if (meta.length) {
        li.append(el("ul", { className: "meta" }, meta.map((m) => el("li", {}, m))));
      }

      const tags = src.source === "github" ? parseTags(src.tags).slice(0, 5) : [];
      if (tags.length) {
        li.append(el("ul", { className: "chips", ariaLabel: "Topics" }, tags.map((t) => el("li", { className: "chip", textContent: t }))));
      }
      return li;
    }

    // Builds the answer as text nodes, turning [n] citations that match a
    // result into links to it. The answer text is never parsed as HTML.
    function renderAnswer(answer, count) {
      const parts = [];
      let last = 0;
      for (const m of answer.matchAll(/\[(\d+)\]/g)) {
        const n = Number(m[1]);
        if (n < 1 || n > count) continue;
        parts.push(answer.slice(last, m.index));
        parts.push(el("a", { className: "cite", href: `#result-${n}`, textContent: `[${n}]` }));
        last = m.index + m[0].length;
      }
      parts.push(answer.slice(last));
      answerEl.replaceChildren(...parts.filter((p) => p !== ""));
    }

    // Without an LLM configured, the API returns an extractive placeholder
    // that only repeats the abstracts shown below, so it is not displayed.
    function isPlaceholderAnswer(answer) {
      return /^Based on \d+ matching document/.test(answer || "");
    }

    function setStatus(text, isError = false) {
      statusEl.className = isError ? "error" : "";
      statusEl.textContent = text;
    }

    function freshnessNote(data) {
      const asOf = data.data_as_of ? formatDate(data.data_as_of) : "";
      return asOf ? `Newest data: ${asOf}` : "";
    }

    function renderSummary(data) {
      const sources = data.sources || [];
      statusEl.className = "";
      statusEl.replaceChildren();
      let count = `${plural(sources.length, "result", "results")} in ${numberFmt.format(Math.round(data.took_ms || 0))} ms`;
      if (data.time_window) count += `, from the ${data.time_window.label}`;
      const note = freshnessNote(data);
      statusEl.append(el("span", { textContent: note ? `${count}. ${note}.` : `${count}.` }));

      const bySource = {};
      for (const s of sources) bySource[s.source] = (bySource[s.source] || 0) + 1;
      const breakdown = el("ul", { className: "breakdown", ariaLabel: "Results by source" });
      for (const [key, label] of Object.entries(SOURCES)) {
        if (!bySource[key]) continue;
        breakdown.append(el("li", { className: `src-${key}` }, [el("span", { className: "marker" }), `${label} ${bySource[key]}`]));
      }
      statusEl.append(breakdown);
    }

    function showView(view) {
      const searching = view === "search";
      dashboardEl.hidden = searching;
      searchViewEl.hidden = !searching;
    }

    async function search(query) {
      showView("search");
      submitBtn.disabled = true;
      form.classList.add("busy");
      setStatus("Searching…");
      answerEl.hidden = true;
      answerEl.replaceChildren();
      sourcesEl.replaceChildren();
      resultsEmptyEl.hidden = true;

      try {
        const data = await fetchWithWake(`${API_BASE}/search`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, limit: extractLimit(query) }),
        }, (secs) => setStatus(`The search service is starting up. Trying again in ${secs} seconds…`));
        const sources = data.sources || [];

        if (sources.length && data.answer && !isPlaceholderAnswer(data.answer)) {
          renderAnswer(data.answer, sources.length);
          answerEl.hidden = false;
        }

        if (!sources.length) {
          const note = freshnessNote(data);
          setStatus(data.time_window ? `Nothing from the ${data.time_window.label}.${note ? ` ${note}.` : ""}` : "No matches.");
          resultsEmptyEl.textContent = data.time_window
            ? "Try the same search without the time range."
            : "Try fewer or broader words.";
          resultsEmptyEl.hidden = false;
        } else {
          newestFirst(sources).forEach((src, i) => sourcesEl.append(renderResult(src, i + 1)));
          renderSummary(data);
        }
      } catch (err) {
        setStatus(`Search failed: ${describeError(err)}. Try again in a minute.`, true);
      } finally {
        submitBtn.disabled = false;
        form.classList.remove("busy");
      }
    }

    // Each search gets its own history entry, so Back returns to the dashboard.
    function runSearch(query) {
      setQuery(query);
      const url = new URL(window.location.href);
      if (url.searchParams.get("q") !== query) {
        url.searchParams.set("q", query);
        history.pushState({ q: query }, "", url);
      }
      search(query);
      window.scrollTo({ top: 0 });
    }

    function goHome() {
      const url = new URL(window.location.href);
      url.searchParams.delete("q");
      history.pushState({}, "", url);
      setQuery("");
      showView("dashboard");
    }

    // The question box is a textarea so long questions wrap; it grows to
    // fit its text and stays a single logical line.
    function autosize() {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight + 2}px`; // + top and bottom border
    }

    function setQuery(text) {
      input.value = text;
      autosize();
    }

    input.addEventListener("input", () => {
      if (input.value.includes("\n")) {
        const end = input.selectionEnd;
        input.value = input.value.replace(/\s*\n\s*/g, " ");
        input.setSelectionRange(end, end);
      }
      autosize();
    });

    // Enter searches, as in a single-line field.
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    window.addEventListener("resize", autosize);
    document.fonts?.ready.then(autosize);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (query) runSearch(query);
    });

    document.getElementById("back-btn").addEventListener("click", goHome);
    document.getElementById("home-link").addEventListener("click", (e) => {
      e.preventDefault();
      goHome();
    });

    window.addEventListener("popstate", () => {
      const q = new URLSearchParams(window.location.search).get("q");
      if (q) {
        setQuery(q);
        search(q);
      } else {
        setQuery("");
        showView("dashboard");
      }
    });

    // "/" jumps to the search box from anywhere on the page.
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
        input.select();
      }
    });

    // The dashboard always loads (it also wakes the API); a shared ?q= link
    // opens straight on its search.
    autosize();
    loadDaily();
    const initial = new URLSearchParams(window.location.search).get("q");
    if (initial) {
      setQuery(initial);
      search(initial);
    }
  </script>
</body>
</html>
