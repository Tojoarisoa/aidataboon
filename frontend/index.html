<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIDataBoon — AI-Powered Data Infrastructure Search</title>
  <meta name="description" content="Natural-language search over Hacker News, arXiv, and GitHub trending — powered by a RAG pipeline on a medallion lakehouse." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121922" media="(prefers-color-scheme: dark)" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aidataboon.com/" />
  <meta property="og:title" content="AIDataBoon" />
  <meta property="og:description" content="Search recent Hacker News threads, arXiv papers and trending GitHub repositories in plain English." />
  <!-- One dot per source (HN, arXiv, GitHub) under the search underline. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316202e'/%3E%3Crect x='6' y='19' width='20' height='3' rx='1.5' fill='%234fc3b5'/%3E%3Ccircle cx='9' cy='12' r='2.6' fill='%23f08a3e'/%3E%3Ccircle cx='16' cy='12' r='2.6' fill='%23e66a70'/%3E%3Ccircle cx='23' cy='12' r='2.6' fill='%23a094f5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" />
  <style>
    :root {
      --page: #eef2f5;
      --ink: #16202e;
      --muted: #566173;
      --rule: #cfd7df;
      --field: #ffffff;
      --accent: #0a7c72;
      --accent-ink: #ffffff;
      --hn: #ad4a08;
      --arxiv: #a8232a;
      --github: #5946c9;

      --sans: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;

      /* 1.25 scale on a 17px base */
      --step--1: 0.8rem;
      --step-0: 1rem;
      --step-1: 1.25rem;
      --step-2: 1.563rem;
      --step-3: 1.953rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #121922;
        --ink: #e3e9ef;
        --muted: #9aa6b5;
        --rule: #2b3644;
        --field: #19222d;
        --accent: #4fc3b5;
        --accent-ink: #0c1a19;
        --hn: #f08a3e;
        --arxiv: #e66a70;
        --github: #a094f5;
      }
    }

    * { box-sizing: border-box; }
    html { font-size: 106.25%; } /* 17px */
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: var(--sans);
      font-size: var(--step-0);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 44rem;
      margin: 0 auto;
      padding: 2.5rem 1rem 2rem;
    }
    main { flex: 1; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

    /* Masthead */
    .masthead { margin-bottom: 2.25rem; }
    .wordmark {
      margin: 0;
      font-size: var(--step-1);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .lede {
      margin: 0.35rem 0 0;
      max-width: 36rem;
      color: var(--muted);
    }
    .index-note {
      margin: 0.5rem 0 0;
      color: var(--muted);
      font-size: var(--step--1);
    }
    .index-note:empty { display: none; }

    /* The question is the hero: set like a headline, typed into directly. */
    .ask { margin-bottom: 1rem; }
    .ask label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .ask-row {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
    }
    /* The heavy underline doubles as the progress bar while searching. */
    .field {
      position: relative;
      flex: 1;
      min-width: 0;
      border-bottom: 3px solid var(--ink);
    }
    .field:focus-within { border-bottom-color: var(--accent); }
    .field::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 30%;
      height: 3px;
      background: var(--accent);
      opacity: 0;
    }
    .busy .field { border-bottom-color: var(--rule); }
    .busy .field::after {
      opacity: 1;
      animation: sweep 1.1s ease-in-out infinite alternate;
    }
    @keyframes sweep {
      from { left: 0; }
      to { left: 70%; }
    }
    /* A textarea so long questions wrap like a headline instead of
       scrolling out of view; it grows with its content (see autosize()). */
    #query {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 500 var(--step-3)/1.2 var(--sans);
      letter-spacing: -0.02em;
      padding: 0.25rem 0 0.35rem;
      resize: none;
      overflow: hidden;
    }
    #query::placeholder { color: var(--muted); opacity: 0.7; }
    #query:focus { outline: none; }
    #submit-btn {
      flex: none;
      margin-bottom: 0.45rem;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font: 700 var(--step-0)/1 var(--sans);
      padding: 0.75rem 1.25rem;
      cursor: pointer;
    }
    #submit-btn:disabled { opacity: 0.6; cursor: progress; }

    .examples {
      margin: 0 0 2.25rem;
      color: var(--muted);
      font-size: var(--step--1);
    }
    .examples[hidden] { display: none; }
    .examples p { margin: 0 0 0.3rem; }
    .examples ul {
      display: grid;
      gap: 0.3rem;
      justify-items: start;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .examples button {
      border: 0;
      padding: 0;
      background: none;
      color: var(--ink);
      font: inherit;
      text-decoration: underline;
      text-decoration-color: var(--rule);
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .examples button:hover { text-decoration-color: var(--accent); }

    /* Status line + per-source breakdown */
    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.25rem 1rem;
      min-height: 1.5em;
      padding-bottom: 0.75rem;
      color: var(--muted);
      font-size: var(--step--1);
    }
    .examples[hidden] + .summary { margin-top: 1.5rem; }
    .summary.error { color: var(--arxiv); }
    .breakdown { display: flex; gap: 0.9rem; margin: 0; padding: 0; list-style: none; }
    .breakdown li { display: flex; align-items: center; gap: 0.35rem; }
    .swatch { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--src); }

    #answer {
      display: none;
      margin: 0 0 1.5rem;
      font: 400 var(--step-1)/1.6 var(--serif);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* Results */
    #sources { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
    .result {
      position: relative;
      padding: 1.1rem 0 1.2rem 1rem;
      border-bottom: 1px solid var(--rule);
      overflow-wrap: anywhere;
    }
    .result::before {
      content: "";
      position: absolute;
      left: 0;
      top: 1.2rem;
      bottom: 1.3rem;
      width: 3px;
      border-radius: 2px;
      background: var(--src);
    }
    .src-hackernews { --src: var(--hn); }
    .src-arxiv { --src: var(--arxiv); }
    .src-github { --src: var(--github); }

    .result-source {
      margin: 0 0 0.15rem;
      color: var(--src);
      font-size: var(--step--1);
      font-weight: 700;
    }
    .result h2 {
      margin: 0;
      max-width: 38rem;
      font-size: var(--step-1);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .result h2 a { text-decoration: none; }
    .result h2 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .abstract {
      margin: 0.4rem 0 0;
      max-width: 38rem;
      font: 400 var(--step-0)/1.6 var(--serif);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 1rem;
      margin: 0.5rem 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: var(--step--1);
    }
    .meta a { color: var(--muted); text-underline-offset: 3px; }
    .meta a:hover { color: var(--ink); }
    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.55rem 0 0; padding: 0; list-style: none; }
    .tags li {
      padding: 0.05rem 0.5rem;
      border: 1px solid var(--rule);
      border-radius: 999px;
      color: var(--muted);
      font-size: var(--step--1);
    }

    .empty { padding: 1.5rem 0; color: var(--muted); }

    footer {
      padding-top: 3rem;
      color: var(--muted);
      font-size: var(--step--1);
    }

    @media (max-width: 34rem) {
      .wrap { padding-top: 1.75rem; }
      #query { font-size: var(--step-2); }
      .ask-row { flex-direction: column; align-items: stretch; gap: 0.75rem; }
      #submit-btn { margin-bottom: 0; padding: 0.85rem 1.25rem; }
      .summary { flex-direction: column; }
      .abstract { -webkit-line-clamp: 2; line-clamp: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
      /* Keep a static indicator instead of the sweep. */
      .busy .field::after { animation: none; left: 0; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <p class="wordmark">AIDataBoon</p>
      <p class="lede">
        Search recent Hacker News threads, arXiv papers and trending GitHub
        repositories in plain English.
      </p>
      <p id="index-note" class="index-note"></p>
    </header>

    <main>
      <form id="search-form" class="ask" role="search">
        <label for="query">What do you want to find?</label>
        <div class="ask-row">
          <div class="field">
            <textarea
              id="query"
              rows="1"
              placeholder="Papers about LLM fine-tuning"
              autocomplete="off"
              enterkeyhint="search"
              maxlength="500"
              required
            ></textarea>
          </div>
          <button type="submit" id="submit-btn">Search</button>
        </div>
      </form>

      <div class="examples" id="examples">
        <p>Try one of these:</p>
        <ul>
          <li><button type="button" data-q="Papers about LLM fine-tuning">Papers about LLM fine-tuning</button></li>
          <li><button type="button" data-q="What is Hacker News saying this week?">What is Hacker News saying this week?</button></li>
          <li><button type="button" data-q="Top 5 trending repos for AI agents">Top 5 trending repos for AI agents</button></li>
        </ul>
      </div>

      <div id="status" class="summary" role="status" aria-live="polite"></div>
      <div id="answer"></div>
      <ol id="sources" hidden></ol>
    </main>

    <footer>&copy; 2026 BoonCore</footer>
  </div>

  <script>
    const API_BASE = "https://api.aidataboon.com/v1";

    const SOURCES = {
      hackernews: "Hacker News",
      arxiv: "arXiv",
      github: "GitHub",
    };

    const form = document.getElementById("search-form");
    const input = document.getElementById("query");
    const statusEl = document.getElementById("status");
    const answerEl = document.getElementById("answer");
    const sourcesEl = document.getElementById("sources");
    const submitBtn = document.getElementById("submit-btn");
    const examplesEl = document.getElementById("examples");
    const indexNoteEl = document.getElementById("index-note");

    const numberFmt = new Intl.NumberFormat("en");
    const dateFmt = new Intl.DateTimeFormat("en", { year: "numeric", month: "short", day: "numeric" });

    // Lets phrases like "top 3", "first 10", or "5 papers" control how
    // many results come back, instead of always requesting 5.
    function extractLimit(query) {
      const patterns = [
        /\btop\s+(\d+)\b/i,
        /\bfirst\s+(\d+)\b/i,
        /\b(\d+)\s+(?:results?|sources?|articles?|items?|papers?|repos?|repositories?|posts?)\b/i,
      ];
      for (const re of patterns) {
        const match = query.match(re);
        if (match) {
          const n = parseInt(match[1], 10);
          if (n >= 1 && n <= 20) return n;
        }
      }
      return 5;
    }

    // Abstracts arrive HTML-escaped and, for HN, with inline markup.
    // DOMParser never runs scripts, so this only extracts the text.
    function plainText(html) {
      if (!html) return "";
      // Block-level tags become spaces so paragraphs don't run together.
      const spaced = String(html).replace(/<\/?(?:p|br|div|li|pre)\b[^>]*>/gi, " ");
      const doc = new DOMParser().parseFromString(spaced, "text/html");
      return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
    }

    // Tags come back as a Python list repr: "['a2a', 'agents']".
    function parseTags(raw) {
      if (Array.isArray(raw)) return raw;
      return [...String(raw || "").matchAll(/'([^']+)'/g)].map((m) => m[1]);
    }

    function toInt(v) {
      const n = parseInt(v, 10);
      return Number.isFinite(n) ? n : 0;
    }

    function plural(n, one, many) {
      return `${numberFmt.format(n)} ${n === 1 ? one : many}`;
    }

    function formatAuthors(raw) {
      const names = String(raw || "").split(",").map((s) => s.trim()).filter(Boolean);
      if (names.length <= 3) return names.join(", ");
      return `${names.slice(0, 3).join(", ")} et al.`;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "" : dateFmt.format(d);
    }

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.assign(node, props);
      for (const child of [].concat(children)) {
        if (child) node.append(child);
      }
      return node;
    }

    // What matters differs per source: points and discussion for HN,
    // stars and forks for GitHub, authors and date for arXiv.
    function metaItems(src) {
      const items = [];
      const score = toInt(src.score);
      const comments = toInt(src.num_comments);
      if (src.source === "hackernews") {
        if (score) items.push(plural(score, "point", "points"));
        const hnId = String(src.id || "").replace(/^hn_/, "");
        const discussion = el("a", {
          href: `https://news.ycombinator.com/item?id=${encodeURIComponent(hnId)}`,
          target: "_blank",
          rel: "noopener",
          textContent: plural(comments, "comment", "comments"),
        });
        if (hnId) items.push(discussion);
        if (src.author) items.push(`by ${src.author}`);
        if (src.published_at) items.push(formatDate(src.published_at));
      } else if (src.source === "github") {
        if (score) items.push(plural(score, "star", "stars"));
        if (comments) items.push(plural(comments, "fork", "forks"));
      } else {
        if (src.author) items.push(formatAuthors(src.author));
        if (src.published_at) items.push(formatDate(src.published_at));
      }
      return items.filter(Boolean);
    }

    function renderResult(src) {
      const key = SOURCES[src.source] ? src.source : "other";
      const li = el("li", { className: `result src-${key}` });

      li.append(el("p", { className: "result-source", textContent: SOURCES[src.source] || src.source || "Source" }));

      const title = el("a", {
        href: src.url || "#",
        target: "_blank",
        rel: "noopener",
        textContent: src.title || src.id || "Untitled",
      });
      li.append(el("h2", {}, title));

      const abstract = plainText(src.abstract || src.content);
      if (abstract && abstract !== src.title) {
        li.append(el("p", { className: "abstract", textContent: abstract }));
      }

      const meta = metaItems(src);
      if (meta.length) {
        li.append(el("ul", { className: "meta" }, meta.map((m) => el("li", {}, m))));
      }

      const tags = src.source === "github" ? parseTags(src.tags).slice(0, 5) : [];
      if (tags.length) {
        li.append(el("ul", { className: "tags", ariaLabel: "Topics" }, tags.map((t) => el("li", { textContent: t }))));
      }
      return li;
    }

    // The index is refreshed in batches, so say how current it is.
    function freshnessNote(data) {
      const asOf = data.data_as_of ? formatDate(data.data_as_of) : "";
      return asOf ? `Newest data: ${asOf}` : "";
    }

    function renderSummary(data) {
      const sources = data.sources || [];
      statusEl.className = "summary";
      statusEl.replaceChildren();
      let count = `${plural(sources.length, "result", "results")} in ${numberFmt.format(Math.round(data.took_ms || 0))} ms`;
      if (data.time_window) count += `, from the ${data.time_window.label}`;
      const note = freshnessNote(data);
      statusEl.append(el("span", { textContent: note ? `${count}. ${note}` : count }));

      const bySource = {};
      for (const s of sources) bySource[s.source] = (bySource[s.source] || 0) + 1;
      const breakdown = el("ul", { className: "breakdown", ariaLabel: "Results by source" });
      for (const [key, label] of Object.entries(SOURCES)) {
        if (!bySource[key]) continue;
        const swatch = el("span", { className: "swatch" });
        breakdown.append(el("li", { className: `src-${key}` }, [swatch, `${label} ${bySource[key]}`]));
      }
      statusEl.append(breakdown);
    }

    function setStatus(text, isError = false) {
      statusEl.className = isError ? "summary error" : "summary";
      statusEl.textContent = text;
    }

    // Without an LLM configured, the API returns an extractive placeholder
    // that only repeats the abstracts shown below, so it is not displayed.
    function isPlaceholderAnswer(answer) {
      return /^Based on \d+ matching document/.test(answer || "");
    }

    async function search(query) {
      submitBtn.disabled = true;
      form.classList.add("busy");
      examplesEl.hidden = true;
      setStatus("Searching…");
      answerEl.style.display = "none";
      answerEl.textContent = "";
      sourcesEl.replaceChildren();
      sourcesEl.hidden = true;

      const url = new URL(window.location.href);
      url.searchParams.set("q", query);
      history.replaceState(null, "", url);

      try {
        const limit = extractLimit(query);
        const maxAttempts = 3;
        let res;
        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          res = await fetch(`${API_BASE}/search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, limit }),
          });

          // 524 = Cloudflare timeout, typically the API waking from an
          // idle scale-to-zero state. Retry after a short wait instead
          // of surfacing a raw error on the first try.
          if (res.status === 524 && attempt < maxAttempts) {
            setStatus(`The search service is starting up. Trying again in ${5 * attempt} seconds…`);
            await new Promise((r) => setTimeout(r, 5000 * attempt));
            continue;
          }
          break;
        }

        if (!res.ok) {
          throw new Error(`the API returned ${res.status}`);
        }

        const data = await res.json();
        const sources = data.sources || [];

        if (sources.length && data.answer && !isPlaceholderAnswer(data.answer)) {
          answerEl.textContent = data.answer;
          answerEl.style.display = "block";
        }

        if (!sources.length) {
          setStatus("");
          const note = freshnessNote(data);
          const message = data.time_window
            ? `Nothing from the ${data.time_window.label}.${note ? ` ${note}.` : ""} Try the same search without the time range.`
            : "No matches. Try fewer or broader words.";
          sourcesEl.append(el("li", { className: "empty", textContent: message }));
        } else {
          for (const src of sources) sourcesEl.append(renderResult(src));
          renderSummary(data);
        }
        sourcesEl.hidden = false;
      } catch (err) {
        // fetch() rejects with a TypeError when the request never got a response.
        const reason = err instanceof TypeError ? "couldn't reach the search service" : err.message;
        setStatus(`Search failed: ${reason}. Try again in a minute.`, true);
      } finally {
        submitBtn.disabled = false;
        form.classList.remove("busy");
      }
    }

    // The question box is a textarea so long questions wrap; it grows to
    // fit its text and stays a single logical line.
    function autosize() {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight}px`;
    }

    function setQuery(text) {
      input.value = text;
      autosize();
    }

    input.addEventListener("input", () => {
      if (input.value.includes("\n")) {
        const end = input.selectionEnd;
        input.value = input.value.replace(/\s*\n\s*/g, " ");
        input.setSelectionRange(end, end);
      }
      autosize();
      if (!input.value.trim()) examplesEl.hidden = false;
    });

    // Enter searches, as in a single-line field.
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    window.addEventListener("resize", autosize);
    document.fonts?.ready.then(autosize);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (query) search(query);
    });

    for (const btn of document.querySelectorAll(".examples button")) {
      btn.addEventListener("click", () => {
        setQuery(btn.dataset.q);
        search(btn.dataset.q);
      });
    }

    // Say what is in the index before anyone searches. This also wakes the
    // API from its idle state, so the first search is faster.
    fetch(`${API_BASE}/health`)
      .then((res) => (res.ok ? res.json() : null))
      .then((health) => {
        if (!health || !health.documents_indexed) return;
        const count = plural(health.documents_indexed, "item", "items");
        const asOf = health.data_as_of ? formatDate(health.data_as_of) : "";
        indexNoteEl.textContent = asOf
          ? `${count} indexed, refreshed daily. Newest from ${asOf}.`
          : `${count} indexed.`;
      })
      .catch(() => {});

    // "/" jumps to the search box from anywhere on the page.
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
        input.select();
      }
    });

    // Shared links (?q=...) run their search on load.
    const initial = new URLSearchParams(window.location.search).get("q");
    if (initial) {
      setQuery(initial);
      search(initial);
    }
  </script>
