<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIDataBoon — AI-Powered Data Infrastructure Search</title>
  <meta name="description" content="Natural-language search over Hacker News, arXiv, and GitHub trending — powered by a RAG pipeline on a medallion lakehouse." />
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --border: #232c3d;
      --text: #e6edf3;
      --muted: #8b97a8;
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }
    header { text-align: center; margin-bottom: 32px; max-width: 640px; }
    h1 { font-size: 1.8rem; margin: 0 0 8px; }
    p.subtitle { color: var(--muted); margin: 0; font-size: 0.95rem; }
    form {
      width: 100%;
      max-width: 640px;
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); }
    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    #status { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; min-height: 1.2em; }
    #answer {
      width: 100%;
      max-width: 640px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      display: none;
    }
    ul#sources { width: 100%; max-width: 640px; padding: 0; list-style: none; }
    ul#sources li {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    ul#sources a { color: var(--accent); text-decoration: none; font-weight: 600; }
    ul#sources a:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 0.8rem; margin-top: 4px; overflow-wrap: anywhere; }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.8rem; text-align: center; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>AIDataBoon</h1>
    <p class="subtitle">
      Ask a question in plain English — search is powered by a RAG pipeline
      over Hacker News, arXiv, and GitHub trending repos, ingested through a
      medallion lakehouse and served from pgvector.
    </p>
  </header>

  <form id="search-form">
    <input
      id="query"
      type="text"
      placeholder="e.g. show me papers about LLM fine-tuning from this week"
      autocomplete="off"
      required
    />
    <button type="submit" id="submit-btn">Search</button>
  </form>

  <div id="status"></div>
  <div id="answer"></div>
  <ul id="sources"></ul>

  <footer>
    &copy; 2026 BoonCore
  </footer>

  <script>
    const API_BASE = "https://api.aidataboon.com/v1";

    const form = document.getElementById("search-form");
    const input = document.getElementById("query");
    const statusEl = document.getElementById("status");
    const answerEl = document.getElementById("answer");
    const sourcesEl = document.getElementById("sources");
    const submitBtn = document.getElementById("submit-btn");

    // Lets phrases like "top 3", "first 10", or "5 papers" control how
    // many results come back, instead of always requesting 5.
    function extractLimit(query) {
      const patterns = [
        /\btop\s+(\d+)\b/i,
        /\bfirst\s+(\d+)\b/i,
        /\b(\d+)\s+(?:results?|sources?|articles?|items?|papers?|repos?|repositories?|posts?)\b/i,
      ];
      for (const re of patterns) {
        const match = query.match(re);
        if (match) {
          const n = parseInt(match[1], 10);
          if (n >= 1 && n <= 20) return n;
        }
      }
      return 5;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      submitBtn.disabled = true;
      statusEl.textContent = "Searching…";
      answerEl.style.display = "none";
      answerEl.textContent = "";
      sourcesEl.innerHTML = "";

      try {
        const limit = extractLimit(query);
        const maxAttempts = 3;
        let res;
        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
          res = await fetch(`${API_BASE}/search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, limit }),
          });

          // 524 = Cloudflare timeout, typically the API waking from an
          // idle scale-to-zero state. Retry after a short wait instead
          // of surfacing a raw error on the first try.
          if (res.status === 524 && attempt < maxAttempts) {
            statusEl.textContent = "Waking up the search service (cold start)… retrying";
            await new Promise((r) => setTimeout(r, 5000 * attempt));
            continue;
          }
          break;
        }

        if (!res.ok) {
          throw new Error(`API returned ${res.status}`);
        }

        const data = await res.json();

        if (data.answer) {
          answerEl.textContent = data.answer;
          answerEl.style.display = "block";
        }

        for (const src of data.sources || []) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = src.url || "#";
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = src.title || src.id || "Untitled";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = [src.source, src.author].filter(Boolean).join(" · ");

          li.appendChild(a);
          li.appendChild(meta);
          sourcesEl.appendChild(li);
        }

        statusEl.textContent = `${(data.sources || []).length} result(s) in ${Math.round(data.took_ms || 0)} ms`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
